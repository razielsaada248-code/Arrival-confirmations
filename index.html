<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>אישור הגעה | אליה ואחינועם</title>
<meta name="description" content="אישור הגעה לחתונה של אליה ואחינועם">
<meta property="og:title" content="אישור הגעה – החתונה של אליה ואחינועם">
<meta property="og:description" content="19.11.2026 · אולמי אטורה, לטרון · נשמח לאישור הגעה">
<meta property="og:image" content="https://razielsaada248-code.github.io/Arrival-confirmations/invitation.jpg">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Frank+Ruhl+Libre:wght@400;700&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* צבעי העיצוב – יותאמו לסגנון ההזמנה */
  :root {
    --bg: #f3efe6;
    --card: #fbf9f3;
    --ink: #4f4b36;
    --muted: #7a7560;
    --accent: #b39b4f;
    --lavender: #8b4f8c;
    --accent-ink: #ffffff;
    --line: #e2dbc8;
    --error: #b3412e;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Heebo", system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.5;
    display: flex;
    justify-content: center;
    padding: 24px 16px 48px;
  }
  main { width: 100%; max-width: 480px; }
  .card {
    background: var(--card);
    border: 2px solid var(--accent);
    border-radius: var(--radius);
    outline: 1px solid var(--line);
    outline-offset: -10px;
    padding: 36px 28px;
    box-shadow: 0 6px 24px rgba(59, 51, 41, 0.06);
  }
  header { text-align: center; margin-bottom: 28px; }
  .eyebrow { color: var(--lavender); letter-spacing: .08em; font-size: 15px; margin: 0 0 6px; }
  h1 {
    font-family: "Amatic SC", "Frank Ruhl Libre", serif;
    font-weight: 700;
    font-size: 52px;
    color: var(--ink);
    line-height: 1.15;
    margin: 0 0 12px;
  }
  .divider { width: 64px; height: 1px; background: var(--lavender); margin: 14px auto; border: 0; }
  .details { color: var(--muted); margin: 0; }
  .details strong { color: var(--ink); font-weight: 500; }
  .waze {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 12px; color: var(--lavender); font-weight: 500; text-decoration: none;
    border-bottom: 1px solid currentColor;
  }
  .deadline { font-size: 15px; color: var(--muted); margin-top: 14px; }

  form { display: grid; gap: 20px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label, legend { display: block; font-weight: 500; margin-bottom: 6px; }
  fieldset { border: 0; padding: 0; margin: 0; }
  input[type="text"], input[type="tel"] {
    width: 100%;
    font: inherit;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fff;
    color: var(--ink);
  }
  input[type="tel"] { direction: ltr; text-align: right; }
  input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }

  .choices { display: grid; gap: 10px; }
  .choices.two { grid-template-columns: 1fr 1fr; }
  .choice input { position: absolute; opacity: 0; pointer-events: none; }
  .choice span {
    display: block; text-align: center;
    padding: 12px 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fff;
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
  }
  .choice input:checked + span { background: var(--lavender); border-color: var(--lavender); color: var(--accent-ink); }
  .choice input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .side-tag {
    display: inline-block; margin: 0 0 10px;
    padding: 3px 14px; border-radius: 999px;
    border: 1px solid var(--lavender); color: var(--lavender);
    font-size: 15px; font-weight: 500;
  }
  select {
    width: 100%; font: inherit;
    padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 10px;
    background: #fff; color: var(--ink);
  }
  select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .hint { font-size: 14px; color: var(--muted); margin: 6px 0 0; }

  .error { color: var(--error); font-size: 14px; margin: 6px 0 0; min-height: 0; }
  .error:empty { display: none; }
  [hidden] { display: none !important; }

  button[type="submit"] {
    font: inherit; font-weight: 700;
    padding: 14px;
    border: 0; border-radius: 10px;
    background: var(--lavender); color: #fff;
    cursor: pointer;
  }
  button[disabled] { opacity: .6; cursor: wait; }
  .hp { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .result { text-align: center; padding: 12px 0; }
  .result h2 { font-family: "Frank Ruhl Libre", serif; font-size: 30px; margin: 0 0 10px; }
  .result p { margin: 0; color: var(--muted); }
  .summary {
    margin: 20px 0 0; padding: 14px 16px;
    border: 1px solid var(--line); border-radius: 10px; background: #fff;
    display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; text-align: right;
  }
  .summary dt { color: var(--muted); }
  .summary dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
  .demo { margin-top: 16px; font-size: 13px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<main>
  <div class="card">
    <header>
      <p class="eyebrow">אישור הגעה לחתונה</p>
      <p class="side-tag" id="sideTag" hidden></p>
      <h1 id="couple"></h1>
      <hr class="divider">
      <p class="details" id="details"></p>
      <a class="waze" id="waze" target="_blank" rel="noopener" hidden>ניווט עם Waze</a>
      <p class="deadline" id="deadline" hidden></p>
    </header>

    <form id="rsvp" novalidate>
      <div class="row">
        <div>
          <label for="firstName">שם פרטי</label>
          <input type="text" id="firstName" name="firstName" autocomplete="given-name" required>
        </div>
        <div>
          <label for="lastName">שם משפחה</label>
          <input type="text" id="lastName" name="lastName" autocomplete="family-name" required>
        </div>
      </div>

      <div>
        <label for="phone">טלפון</label>
        <input type="tel" id="phone" name="phone" inputmode="numeric" autocomplete="tel" placeholder="050-0000000" required>
      </div>

      <fieldset id="sideField">
        <legend>אני מוזמן מ...</legend>
        <div class="choices two">
          <label class="choice"><input type="radio" name="side" value="groom"><span>צד החתן</span></label>
          <label class="choice"><input type="radio" name="side" value="bride"><span>צד הכלה</span></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>האם תגיעו?</legend>
        <div class="choices">
          <label class="choice"><input type="radio" name="attendance" value="מגיע"><span>מגיע/ה</span></label>
          <label class="choice"><input type="radio" name="attendance" value="לא מגיע"><span>לא מגיע/ה</span></label>
          <label class="choice"><input type="radio" name="attendance" value="לא יודע עדיין"><span>עוד לא יודע/ת</span></label>
        </div>
      </fieldset>

      <fieldset id="guestsField" hidden>
        <legend>כמה מגיעים?</legend>
        <div class="choices two">
          <label class="choice"><input type="radio" name="guests" value="1"><span>1</span></label>
          <label class="choice"><input type="radio" name="guests" value="2"><span>2</span></label>
        </div>
        <p class="hint">המקומות מיועדים עד שני אנשים להזמנה.</p>
      </fieldset>

      <fieldset id="partyField" hidden>
        <legend>כמה מגיעים?</legend>
        <div class="row">
          <div>
            <label for="adults">מבוגרים</label>
            <select id="adults" name="adults"><option value="1" selected>1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option></select>
          </div>
          <div>
            <label for="kids">ילדים עד גיל 5</label>
            <select id="kids" name="kids"><option value="0" selected>0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option></select>
          </div>
        </div>
        <div id="namesField" hidden>
          <label for="names" style="margin-top:12px">שמות המגיעים איתך</label>
          <input type="text" id="names" name="names" autocomplete="off" placeholder="לדוגמה: רחל, יוסי, נועה">
          <p class="hint">לא חובה, אבל נשמח לדעת.</p>
        </div>
      </fieldset>

      <div id="companionField" hidden>
        <label for="companion">עם מי אתה מגיע?</label>
        <input type="text" id="companion" name="companion" autocomplete="off" placeholder="שם פרטי ושם משפחה">
      </div>

      <div class="hp" aria-hidden="true">
        <label for="website">אתר</label>
        <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
      </div>

      <p class="error" id="formError" role="alert"></p>
      <button type="submit" id="submitBtn">שליחה</button>
    </form>

    <div class="result" id="result" hidden>
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
      <dl class="summary" id="summary" hidden></dl>
    </div>
  </div>
  <p class="demo" id="demo" hidden>מצב תצוגה: הטופס עוד לא מחובר לגיליון, תשובות לא נשמרות.</p>
</main>

<script>
  // ===== הגדרות האירוע – למלא כאן =====
  const CONFIG = {
    coupleNames: 'אליה ואחינועם',
    dateText: 'יום חמישי, אור לי\' כסלו התשפ"ז',
    gregorianDate: '19.11.2026',
    timeText: 'קבלת פנים 18:30 · חופה וקידושין 19:00',
    venue: 'אולמי אטורה, פארק מיני ישראל לטרון',
    address: 'אטורה מיני ישראל לטרון', // חיפוש היעד ב-Waze
    deadlineText: 'נשמח לתשובתכם עד יום שני, 9.11.2026',
    scriptUrl: 'https://script.google.com/macros/s/AKfycbzCKpgDIGwDeeKfKWOAsV_oq92LbAAhi9BtDXaxldm3nybhr_LxamLcIsqUXLvCi99I/exec'
  };
  // =====================================

  const $ = (id) => document.getElementById(id);
  const form = $('rsvp');

  $('couple').textContent = CONFIG.coupleNames;
  const details = [CONFIG.dateText, CONFIG.gregorianDate, CONFIG.timeText, CONFIG.venue].filter(Boolean);
  details.forEach((text, i) => {
    if (i) $('details').append(document.createElement('br'));
    const el = document.createElement(i < 2 ? 'strong' : 'span');
    el.textContent = text;
    $('details').append(el);
  });
  if (CONFIG.address) {
    $('waze').href = 'https://waze.com/ul?q=' + encodeURIComponent(CONFIG.address) + '&navigate=yes';
    $('waze').hidden = false;
  }
  if (CONFIG.deadlineText) {
    $('deadline').textContent = CONFIG.deadlineText;
    $('deadline').hidden = false;
  }
  if (!CONFIG.scriptUrl) $('demo').hidden = false;

  // קישור עם ?side=groom או ?side=bride קובע את הצד מראש ומסתיר את השאלה
  const presetSide = new URLSearchParams(location.search).get('side');
  if (presetSide === 'groom' || presetSide === 'bride') {
    form.querySelector(`input[name="side"][value="${presetSide}"]`).checked = true;
    $('sideField').hidden = true;
    $('sideTag').textContent = presetSide === 'bride' ? 'מוזמני צד הכלה' : 'מוזמני צד החתן';
    $('sideTag').hidden = false;
  }

  // צד החתן: 1 או 2 + שם המלווה. צד הכלה: מספר מבוגרים וילדים עד גיל 5.
  function updateFields() {
    const fd = new FormData(form);
    const coming = fd.get('attendance') === 'מגיע';
    const bride = fd.get('side') === 'bride';
    $('guestsField').hidden = !coming || bride;
    $('partyField').hidden = !coming || !bride;
    $('companionField').hidden = !coming || bride || fd.get('guests') !== '2';
    if ($('guestsField').hidden) form.querySelectorAll('input[name="guests"]').forEach((r) => (r.checked = false));
    if ($('companionField').hidden) $('companion').value = '';
    const party = Number(fd.get('adults')) + Number(fd.get('kids'));
    $('namesField').hidden = $('partyField').hidden || party < 2;
    if ($('namesField').hidden) $('names').value = '';
  }

  form.addEventListener('change', (e) => {
    if (['attendance', 'side', 'guests', 'adults', 'kids'].includes(e.target.name)) updateFields();
  });

  // מספר ישראלי (05X...) או מספר מחו"ל עם קידומת מדינה (+33..., 0033...)
  function normalizePhone(raw) {
    const intl = /^\s*(\+|00)/.test(String(raw));
    let digits = String(raw).replace(/\D/g, '');
    if (intl && digits.startsWith('00')) digits = digits.slice(2);
    if (digits.startsWith('972')) digits = '0' + digits.slice(3);
    else if (intl) return /^[1-9]\d{7,14}$/.test(digits) ? '+' + digits : '';
    return /^0\d{8,9}$/.test(digits) ? digits : '';
  }

  function validate(data) {
    if (!data.firstName || !data.lastName) return 'נא למלא שם פרטי ושם משפחה';
    if (!data.phone) return 'נא להזין מספר טלפון תקין (מספר מחו"ל: עם קידומת המדינה, למשל ‎+33)';
    if (!data.side) return 'נא לבחור צד חתן או צד כלה';
    if (!data.attendance) return 'נא לבחור אם תגיעו';
    if (data.attendance === 'מגיע' && data.side !== 'bride' && !data.guests) return 'נא לבחור כמה מגיעים';
    if (data.guests === '2' && !data.companion) return 'נא למלא עם מי אתה מגיע';
    return '';
  }

  function showResult(title, text, data) {
    form.hidden = true;
    $('deadline').hidden = true; // במסך האישור התאריך האחרון מבלבל
    $('resultTitle').textContent = title;
    $('resultText').textContent = text;
    if (data) showSummary(data);
    $('result').hidden = false;
  }

  // מציג לשולח את מה שנשלח, כדי שיוכל לוודא שהפרטים נכונים
  function showSummary(data) {
    const rows = [
      ['שם', data.firstName + ' ' + data.lastName],
      ['טלפון', data.phone.replace(/^(\d{3})(\d+)$/, '$1-$2')],
      ['צד', data.side === 'bride' ? 'צד הכלה' : 'צד החתן'],
      ['תשובה', data.attendance]
    ];
    if (data.attendance === 'מגיע') {
      if (data.side === 'bride') {
        rows.push(['מבוגרים', data.adults], ['ילדים עד גיל 5', data.kids]);
        if (data.names) rows.push(['שמות המגיעים', data.names]);
      } else {
        rows.push(['מספר מגיעים', data.guests]);
        if (data.companion) rows.push(['מגיע עם', data.companion]);
      }
    }
    const dl = $('summary');
    dl.replaceChildren();
    rows.forEach(([label, value]) => {
      const dt = document.createElement('dt');
      const dd = document.createElement('dd');
      dt.textContent = label;
      dd.textContent = value;
      dl.append(dt, dd);
    });
    dl.hidden = false;
  }

  const MESSAGES = {
    'מגיע': ['תודה, נתראה בשמחה!', 'אישור ההגעה נקלט.'],
    'לא מגיע': ['תודה על העדכון', 'נשמח לחגוג איתכם בהזדמנות אחרת.'],
    'לא יודע עדיין': ['תודה, רשמנו', 'נשלח לכם תזכורת בהמשך כדי לקבל תשובה סופית.']
  };

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const data = {
      firstName: (fd.get('firstName') || '').trim(),
      lastName: (fd.get('lastName') || '').trim(),
      phone: normalizePhone(fd.get('phone') || ''),
      side: fd.get('side') || '',
      attendance: fd.get('attendance') || '',
      guests: fd.get('guests') || '',
      companion: (fd.get('companion') || '').trim(),
      adults: fd.get('adults') || '',
      kids: fd.get('kids') || '',
      names: (fd.get('names') || '').trim(),
      website: fd.get('website') || ''
    };
    const error = validate(data);
    $('formError').textContent = error;
    if (error) return;

    const btn = $('submitBtn');
    btn.disabled = true;
    btn.textContent = 'שולח...';
    try {
      let res = { status: 'ok' };
      if (CONFIG.scriptUrl) {
        const r = await fetch(CONFIG.scriptUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(data)
        });
        res = await r.json();
      }
      if (res.status === 'ok' || res.status === 'updated') {
        showResult(...MESSAGES[data.attendance], data);
      } else if (res.status === 'already') {
        showResult('כבר קיבלנו את תשובתך', (res.saved ? 'אלה הפרטים ששמורים אצלנו. ' : '') + 'לשינוי תשובה אפשר לפנות ישירות לחתן או לכלה.', res.saved);
      } else {
        throw new Error(res.message || 'שגיאה');
      }
    } catch (err) {
      $('formError').textContent = 'השליחה נכשלה. נא לנסות שוב בעוד רגע.' + (err && err.message ? ' (' + err.message + ')' : '');
      btn.disabled = false;
      btn.textContent = 'שליחה';
    }
  });
</script>
</body>
</html>
